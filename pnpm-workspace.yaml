packages:
  - 'apps/api'
  - 'apps/web'
  - 'packages/*'

overrides:
  body-parser: 1.20.6
  deepmerge-ts: 8.0.2
  file-type: 21.3.2
  js-yaml: 4.3.1
  lodash: 4.18.1
  multer: 2.2.0
  postcss: 8.5.26
  qs: 6.15.3

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  esbuild: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.102.5'
  - '@tanstack/react-query@5.102.5'

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - 'bcrypt'
  - 'esbuild'
  - 'prisma'
  - 'unrs-resolver'
