name: Japanese Study Hub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: japanese_learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/japanese_learning_test?schema=public
      AUTH_USERNAME: admin
      AUTH_PASSWORD_HASH: '$2b$10$7iWNjEdErD12hmTUfcOkk.UNs0g9fjQla/BZbvgnnC56cBAu2.2Aa'
      AUTH_TOKEN_SECRET: development_super_secret_jwt_key_at_least_32_chars_long
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_MAX_BYTES: 10485760
      LOG_LEVEL: debug
      PUBLIC_API_BASE_URL: http://localhost:4000/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @japanese-learning/api prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Build packages and applications
        run: pnpm build
