name: Japanese Study Hub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: japanese_learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/japanese_learning_test?schema=public
      AUTH_USERNAME: admin
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_MAX_BYTES: 10485760
      LOG_LEVEL: debug
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate deployment shell scripts
        run: bash -n docker/backup.sh docker/restore.sh docker/production-update.sh docker/verify-backup-restore.sh docker/recent-errors.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral test credentials
        run: |
          password_hash=$(pnpm --filter @japanese-learning/api exec node -e "const bcrypt=require('bcrypt'); process.stdout.write(bcrypt.hashSync('ci-only-password', 4));")
          echo "AUTH_PASSWORD_HASH=$password_hash" >> "$GITHUB_ENV"
          echo "AUTH_TOKEN_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Generate Prisma Client
        run: pnpm --filter @japanese-learning/api prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Build packages and applications
        run: pnpm build

      - name: Check Web bundle guardrail
        run: pnpm perf:bundle

  android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-35"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android tests, lint, and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleProduction verifyApiBaseUrls --stacktrace
