name: Japanese Study Hub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCTION_WEB_API_BASE_URL: http://157.173.127.217:4000/api/v1

jobs:
  static-validation:
    name: Static and deployment policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GHCR_OWNER: nguyentrungnghia1802
      IMAGE_TAG: ${{ github.sha }}
      POSTGRES_PASSWORD: ci-only-postgres-password
      DATABASE_URL: postgresql://postgres:ci-only-postgres-password@postgres:5432/japanese_learning?schema=public
      AUTH_USERNAME: admin
      AUTH_PASSWORD_HASH: ci-only-password-hash
      AUTH_TOKEN_SECRET: ci-only-token-secret-that-is-long-enough
      CORS_ORIGINS: http://127.0.0.1:3000
      BIND_ADDRESS: 127.0.0.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate production artifacts
        run: bash docker/validate-production-artifacts.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck

      - name: ShellCheck deployment scripts
        run: shellcheck --severity=warning docker/*.sh scripts/verify-migrations.sh

      - name: Validate production Compose without starting services
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Exercise immutable deployment dry-run
        run: |
          set -Eeuo pipefail
          runtime="$RUNNER_TEMP/jsh-runtime"
          env_file="$RUNNER_TEMP/jsh-production.env"
          mkdir -p "$runtime"
          cat > "$env_file" <<'ENV'
          GHCR_OWNER=nguyentrungnghia1802
          POSTGRES_PASSWORD=ci-only-postgres-password
          DATABASE_URL=postgresql://postgres:ci-only-postgres-password@postgres:5432/japanese_learning?schema=public
          AUTH_USERNAME=admin
          AUTH_PASSWORD_HASH=ci-only-password-hash
          AUTH_TOKEN_SECRET=ci-only-token-secret-that-is-long-enough
          CORS_ORIGINS=http://127.0.0.1:3000
          POSTGRES_VOLUME_NAME=japanese_study_hub_postgres_data
          BIND_ADDRESS=127.0.0.1
          ENV
          IMAGE_TAG="$GITHUB_SHA" \
            RUNTIME_DIR="$runtime" \
            COMPOSE_FILE="$GITHUB_WORKSPACE/docker-compose.prod.yml" \
            ENV_FILE="$env_file" \
            BACKUP_SCRIPT="$GITHUB_WORKSPACE/docker/backup.sh" \
            VERIFY_SCRIPT="$GITHUB_WORKSPACE/docker/verify-backup-restore.sh" \
            BACKUP_DIR="$RUNNER_TEMP/jsh-backups" \
            STATE_DIR="$RUNNER_TEMP/jsh-state" \
            LOG_DIR="$RUNNER_TEMP/jsh-logs" \
            bash docker/production-update.sh --dry-run

  node-quality:
    name: Node lint, typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: japanese_learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d japanese_learning_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/japanese_learning_test?schema=public
      AUTH_USERNAME: admin
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_MAX_BYTES: 10485760
      LOG_LEVEL: debug
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Generate ephemeral test credentials
        run: |
          password_hash=$(pnpm --filter @japanese-learning/api exec node -e "const bcrypt=require('bcrypt'); process.stdout.write(bcrypt.hashSync('ci-only-password', 4));")
          printf 'AUTH_PASSWORD_HASH=%s\n' "$password_hash" >> "$GITHUB_ENV"
          printf 'AUTH_TOKEN_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Generate Prisma Client
        run: pnpm --filter @japanese-learning/api prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build production application artifacts once
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.PRODUCTION_WEB_API_BASE_URL }}
        run: pnpm build

      - name: Verify production artifact layout
        run: |
          test -s apps/api/dist/main.js
          test -s packages/contracts/dist/index.js
          test -s packages/shared/dist/index.js
          test -s apps/web/.next/standalone/apps/web/server.js
          test -d apps/web/.next/static

      - name: Check Web bundle guardrail
        run: pnpm perf:bundle

      - name: Archive production build artifacts for the Docker job
        run: |
          tar --create --gzip --file "$RUNNER_TEMP/jsh-production-build.tar.gz" \
            apps/api/dist \
            packages/contracts/dist \
            packages/shared/dist \
            apps/web/.next/standalone \
            apps/web/.next/static \
            apps/web/public

      - name: Upload production build artifact for the Docker job
        uses: actions/upload-artifact@v4
        with:
          name: jsh-production-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/jsh-production-build.tar.gz

  node-integration:
    name: API PostgreSQL integration tests
    needs: node-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: japanese_learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d japanese_learning_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/japanese_learning_test?schema=public
      AUTH_USERNAME: admin
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_MAX_BYTES: 10485760
      LOG_LEVEL: debug
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the CI-built API artifact
        uses: actions/download-artifact@v4
        with:
          name: jsh-production-build-${{ github.sha }}
          path: ${{ runner.temp }}/jsh-production-artifact

      - name: Extract the CI-built application artifact
        run: tar --extract --gzip --file "$RUNNER_TEMP/jsh-production-artifact/jsh-production-build.tar.gz" --directory .

      - name: Generate ephemeral test credentials
        run: |
          password_hash=$(pnpm --filter @japanese-learning/api exec node -e "const bcrypt=require('bcrypt'); process.stdout.write(bcrypt.hashSync('ci-only-password', 4));")
          printf 'AUTH_PASSWORD_HASH=%s\n' "$password_hash" >> "$GITHUB_ENV"
          printf 'AUTH_TOKEN_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Generate Prisma Client
        run: pnpm --filter @japanese-learning/api prisma:generate

      - name: Apply migrations to the integration database
        run: pnpm --filter @japanese-learning/api exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Run authenticated API smoke and conditional-cache checks
        run: |
          set -Eeuo pipefail
          node apps/api/dist/main.js > "$RUNNER_TEMP/jsh-api.log" 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" >/dev/null 2>&1 || true
            wait "$api_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              cat "$RUNNER_TEMP/jsh-api.log"
              exit 1
            fi
            sleep 1
          done
          login_response=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-only-password"}' \
            http://127.0.0.1:4000/api/v1/auth/login)
          api_token=$(printf '%s' "$login_response" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(data).accessToken));")
          test -n "$api_token"
          API_SMOKE_TOKEN="$api_token" pnpm perf:api-smoke
          API_SMOKE_TOKEN="$api_token" pnpm perf:api-cache

      - name: Run authenticated API integration tests
        env:
          RUN_API_INTEGRATION: '1'
        run: pnpm --filter @japanese-learning/api test:integration

  migration-compatibility:
    name: Fresh and V1-to-current migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: japanese_learning_migration_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d japanese_learning_migration_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MIGRATION_ADMIN_DATABASE_URL: postgresql://postgres:postgres_password@localhost:5432/japanese_learning_migration_admin
      MIGRATION_DATABASE_URL_TEMPLATE: postgresql://postgres:postgres_password@localhost:5432/%DB%?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify fresh and V1 upgrade migrations
        run: bash scripts/verify-migrations.sh

  android:
    name: Android lint, unit tests, and APK builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-35"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android tests, lint, and build variants
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleProduction assembleRelease verifyApiBaseUrls --stacktrace --no-daemon --console=plain

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsh-android-apks-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/mobile/app/build/outputs/apk/debug/*.apk
            apps/mobile/app/build/outputs/apk/production/*.apk
            apps/mobile/app/build/outputs/apk/release/*.apk

  docker-publish:
    name: Build and publish immutable API/Web images
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - static-validation
      - node-quality
      - node-integration
      - migration-compatibility
      - android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
          - name: web
            dockerfile: docker/Dockerfile.web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the already-built application artifacts
        uses: actions/download-artifact@v4
        with:
          name: jsh-production-build-${{ github.sha }}
          path: ${{ runner.temp }}/jsh-production-artifact

      - name: Extract the already-built application artifacts
        run: tar --extract --gzip --file "$RUNNER_TEMP/jsh-production-artifact/jsh-production-build.tar.gz" --directory .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push one image per application
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            VCS_REF=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/japanese-study-hub-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/japanese-study-hub-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-production:
    name: Deploy immutable SHA to production VPS
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: docker-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: japanese-study-hub-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate required deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_READ_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is not configured"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is not configured"; exit 1; }
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || { echo "DEPLOY_SSH_PRIVATE_KEY is not configured"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS is not configured"; exit 1; }
          test -n "$GHCR_READ_USERNAME" || { echo "GHCR_READ_USERNAME is not configured"; exit 1; }
          test -n "$GHCR_READ_TOKEN" || { echo "GHCR_READ_TOKEN is not configured"; exit 1; }
          ssh_port="${DEPLOY_SSH_PORT:-22}"
          [[ "$ssh_port" =~ ^[0-9]+$ && "$ssh_port" -ge 1 && "$ssh_port" -le 65535 ]] ||
            { echo "DEPLOY_SSH_PORT must be between 1 and 65535"; exit 1; }
          [[ "$GHCR_READ_USERNAME" =~ ^[A-Za-z0-9-]+$ ]] ||
            { echo "GHCR_READ_USERNAME contains unsupported characters"; exit 1; }

      - name: Prepare pinned SSH identity and known hosts
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          ssh_dir="${RUNNER_TEMP}/jsh-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          printf 'JSH_SSH_DIR=%s\n' "$ssh_dir" >> "$GITHUB_ENV"

      - name: Sync deployment artifacts without source checkout on the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          ssh_port="${DEPLOY_SSH_PORT:-22}"
          ssh_opts=(-i "$JSH_SSH_DIR/id_ed25519" -p "$ssh_port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$JSH_SSH_DIR/known_hosts")
          artifact_dir="${RUNNER_TEMP}/jsh-deploy-artifacts"
          install -d -m 0700 "$artifact_dir"
          cp docker-compose.prod.yml "$artifact_dir/docker-compose.prod.yml"
          for script in backup.sh backup-and-verify.sh restore.sh verify-backup-restore.sh production-update.sh recent-errors.sh; do
            cp "docker/$script" "$artifact_dir/$script"
            chmod 0755 "$artifact_dir/$script"
          done
          chmod 0644 "$artifact_dir/docker-compose.prod.yml"
          remote_staging="/tmp/japanese-study-hub-deploy-$GITHUB_SHA"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; install -d -m 0700 '$remote_staging'"
          scp "${ssh_opts[@]}" "$artifact_dir/docker-compose.prod.yml" "$DEPLOY_USER@$DEPLOY_HOST:$remote_staging/"
          scp "${ssh_opts[@]}" "$artifact_dir"/*.sh "$DEPLOY_USER@$DEPLOY_HOST:$remote_staging/"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$remote_staging" "$GITHUB_SHA" <<'REMOTE_INSTALL'
          set -Eeuo pipefail
          staging="$1"
          image_sha="$2"
          runtime="/opt/japanese-learning-runtime"
          [[ "$staging" =~ ^/tmp/japanese-study-hub-deploy-[0-9a-f]{40}$ ]]
          [[ "$image_sha" =~ ^[0-9a-f]{40}$ ]]
          test -d "$staging"
          trap 'rm -rf -- "$staging"' EXIT
          install -d -m 0750 "$runtime" "$runtime/docker"
          install -m 0644 "$staging/docker-compose.prod.yml" "$runtime/docker-compose.prod.yml.new"
          for script in backup.sh backup-and-verify.sh restore.sh verify-backup-restore.sh production-update.sh recent-errors.sh; do
            install -m 0755 "$staging/$script" "$runtime/docker/$script.new"
          done
          test -f "$runtime/.env.production"
          IMAGE_TAG="$image_sha" docker compose --env-file "$runtime/.env.production" -f "$runtime/docker-compose.prod.yml.new" config --quiet
          mv -f "$runtime/docker-compose.prod.yml.new" "$runtime/docker-compose.prod.yml"
          for script in backup.sh backup-and-verify.sh restore.sh verify-backup-restore.sh production-update.sh recent-errors.sh; do
            mv -f "$runtime/docker/$script.new" "$runtime/docker/$script"
          done
          trap - EXIT
          rm -rf -- "$staging"
          REMOTE_INSTALL

      - name: Authenticate the VPS Docker client to GHCR with a read-only token
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          GHCR_READ_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          ssh_port="${DEPLOY_SSH_PORT:-22}"
          ssh_opts=(-i "$JSH_SSH_DIR/id_ed25519" -p "$ssh_port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$JSH_SSH_DIR/known_hosts")
          printf -v ghcr_user_shell '%q' "$GHCR_READ_USERNAME"
          printf '%s' "$GHCR_READ_TOKEN" |
            ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io --username $ghcr_user_shell --password-stdin"

      - name: Run the immutable production deployment and logout
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          ssh_port="${DEPLOY_SSH_PORT:-22}"
          ssh_opts=(-i "$JSH_SSH_DIR/id_ed25519" -p "$ssh_port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$JSH_SSH_DIR/known_hosts")
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$GITHUB_SHA" <<'REMOTE_DEPLOY'
          set +e
          image_sha="$1"
          IMAGE_TAG="$image_sha" RUNTIME_DIR="/opt/japanese-learning-runtime" ENV_FILE="/opt/japanese-learning-runtime/.env.production" bash "/opt/japanese-learning-runtime/docker/production-update.sh"
          status="$?"
          docker logout ghcr.io >/dev/null 2>&1 || true
          exit "$status"
          REMOTE_DEPLOY

      - name: Remove only the temporary remote artifact directory
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          test -d "${JSH_SSH_DIR:-}" || exit 0
          ssh_port="${DEPLOY_SSH_PORT:-22}"
          ssh_opts=(-i "$JSH_SSH_DIR/id_ed25519" -p "$ssh_port" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$JSH_SSH_DIR/known_hosts")
          remote_staging="/tmp/japanese-study-hub-deploy-$GITHUB_SHA"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$remote_staging" <<'REMOTE_CLEANUP'
          set -Eeuo pipefail
          staging="$1"
          if [[ "$staging" =~ ^/tmp/japanese-study-hub-deploy-[0-9a-f]{40}$ ]]; then
            rm -rf -- "$staging"
          fi
          REMOTE_CLEANUP
